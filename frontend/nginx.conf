# Behind another proxy that ends HTTPS (production), keep the scheme it saw; otherwise use our own.
# Google's login only accepts the https callback address there.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 30m;

    # Docker DNS, re-resolved so a restarted backend container (new IP) doesn't cause 502s.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    # $http_host keeps the port, so Google's callback address matches what the browser used.
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Login (Google and password) and logout are handled by the backend.
    location ~ ^/(oauth|login|logout) {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Not in nginx's default MIME list; browsers want this type for the install manifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must always be revalidated, otherwise browsers keep showing an old build.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
