services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: hyttebok
      POSTGRES_USER: hyttebok
      POSTGRES_PASSWORD: hyttebok
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyttebok"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/hyttebok
      DB_USER: hyttebok
      DB_PASSWORD: hyttebok
      UPLOAD_DIR: /data/uploads
      # Put OPENAI_API_KEY=... in a .env file next to this one (not committed) to turn on the chatbot.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Google login: set both in .env. Without GOOGLE_CLIENT_ID the app has no login.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # System admins, comma-separated emails (e.g. you@gmail.com): manage access on the "Tilgang" page.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Email (optional, any SMTP provider): password links and invitations. PUBLIC_URL goes into the links.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  # Once a day: a database dump (kept KEEP_DAYS days) and a copy of new photos, into BACKUP_DIR on the host.
  # Photo files never change (a new upload is a new file), so they're copied once and kept. Restore: see README.
  backup:
    image: postgres:18-alpine
    environment:
      PGHOST: db
      PGUSER: hyttebok
      PGPASSWORD: hyttebok
      PGDATABASE: hyttebok
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - uploads:/data/uploads:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /backups/uploads
        while true; do
          stamp=$$(date +%F)
          if pg_dump -Fc -f /backups/hyttebok-$$stamp.dump.tmp && mv /backups/hyttebok-$$stamp.dump.tmp /backups/hyttebok-$$stamp.dump \
             && for f in /data/uploads/*; do [ -e "/backups/uploads/$${f##*/}" ] || cp "$$f" /backups/uploads/; done; then
            echo "backup $$stamp ok"
            find /backups -maxdepth 1 -name 'hyttebok-*.dump' -mtime +$$KEEP_DAYS -delete
          else
            echo "backup $$stamp FAILED"
          fi
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8113:80"
    depends_on:
      - backend

volumes:
  db-data:
  uploads:
