micronaut.application.name=hyttebok
micronaut.server.multipart.max-file-size=26214400
micronaut.server.max-request-size=26214400
datasources.default.url=${DB_URL:`jdbc:postgresql://localhost:5432/hyttebok`}
datasources.default.username=${DB_USER:hyttebok}
datasources.default.password=${DB_PASSWORD:hyttebok}
datasources.default.db-type=postgres
datasources.default.dialect=POSTGRES
datasources.default.driver-class-name=org.postgresql.Driver
flyway.datasources.default.enabled=true
# Cabin data (@TenantId cabinId) is filtered by the cabin of the request (CabinTenantResolver).
micronaut.data.multi-tenancy.mode=DISCRIMINATOR
hyttebok.upload-dir=${UPLOAD_DIR:./uploads}
micronaut.server.thread-selection=BLOCKING
micronaut.serde.serialization.inclusion=ALWAYS
# Contact for push services (VAPID "sub"); Apple wants a mailto: or https: URL.
hyttebok.push.subject=${VAPID_SUBJECT:`https://github.com/lommerusk113/hyttebok`}
# ---- Login (Google and/or email + password) ----
# Without GOOGLE_CLIENT_ID and ADMIN_EMAILS login is off and the app is open to everyone on the network, as before (LoginOffRule).
# After Google's login the backend sets its own signed cookie (90 days), so nobody is sent back to Google every hour.
micronaut.security.authentication=cookie
micronaut.security.oauth2.clients.google.client-id=${GOOGLE_CLIENT_ID:}
micronaut.security.oauth2.clients.google.client-secret=${GOOGLE_CLIENT_SECRET:}
micronaut.security.oauth2.clients.google.openid.issuer=https://accounts.google.com
# The cookie's signing key is generated once and kept in the database (SessionSigningFactory).
micronaut.security.token.generator.access-token.expiration=7776000
micronaut.security.token.cookie.cookie-max-age=90d
micronaut.security.token.cookie.cookie-same-site=Lax
# System admins (comma-separated emails): manage who has access, including giving themselves access.
hyttebok.admin-emails=${ADMIN_EMAILS:}
micronaut.security.redirect.login-success=/
micronaut.security.redirect.login-failure=/?login=failed
micronaut.security.redirect.logout=/
micronaut.security.endpoints.logout.get-allowed=true
# Email + password: POST /login {username, password} sets the same cookie (PasswordAuthenticationProvider).
micronaut.security.endpoints.login.enabled=true
# No HTTP Basic: it's switched on by having a password provider, and its "WWW-Authenticate: Basic" makes
# browsers pop up their own username/password box on every 401. The app shows its own login page instead.
micronaut.security.basic-auth.enabled=false
# The API answers 401 (the app then shows the login page) instead of redirecting.
micronaut.security.redirect.unauthorized.enabled=false
micronaut.security.redirect.forbidden.enabled=false
micronaut.security.intercept-url-map[0].pattern=/api/**
micronaut.security.intercept-url-map[0].access[0]=isAuthenticated()
# Behind nginx: build Google's callback address from the browser's host and scheme.
micronaut.server.host-resolution.host-header=Host
micronaut.server.host-resolution.protocol-header=X-Forwarded-Proto

# Chatbot (OpenAI). Empty key = chat switched off.
hyttebok.chat.api-key=${OPENAI_API_KEY:}
hyttebok.chat.model=${OPENAI_MODEL:gpt-5-nano}
# Only changed to test against a stand-in for OpenAI.
hyttebok.chat.url=${OPENAI_URL:`https://api.openai.com/v1/chat/completions`}
